<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ========================================================
         SESSION 9-10: TOP CART BUTTON & NAVBAR
         ======================================================== -->
    <nav class="top-nav">
        <div class="top-logo"><a href="index.html" class="logo-link">🦖 food<span>ZILLA</span></a></div>
        <div class="top-nav-links">
            <a href="index.html" class="nav-link active">🏠 Home</a>
            <a href="#categories" class="nav-link">🥗 Menu</a>
            <a href="contact.html" class="nav-link">📞 Contact & Delivery</a>
            <a href="opinion.html" class="nav-link">⭐ Opinions</a>
            <a href="how-to-use.html" class="nav-link">📖 How to Use</a>
        </div>
        <div class="top-nav-actions">
            <a href="tel:19844" class="nav-hotline-pill" title="Call Hotline 19844">📞 19844</a>
            <button class="account-btn" id="accountButton" onclick="showSignIn()">Sign in</button>
            <button class="top-cart-btn" onclick="toggleCart()">
                🛒 Cart <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </nav>

    <!-- ========================================================
         SESSION 2-10: MAIN CONTAINER, HEADER & RECIPES
         ======================================================== -->
    <div class="container">
        <header>

            <div class="lightning-flash"></div>
            <svg class="godzilla-monster" viewBox="0 0 100 100" xmlns="http://w3.org">

                <path d="M 5 100 
             C 5 95, 2 92, 4 88 
             C 2 85, 3 80, 7 76 
             C 5 73, 6 68, 11 65 
             C 9 60, 13 55, 18 52 
             C 16 48, 20 44, 25 41 
             C 23 35, 29 30, 36 28 
             C 38 22, 45 18, 54 16 
             C 56 12, 64 8, 72 6 
             C 74 2, 79 0, 84 2 
             C 86 5, 84 10, 81 14 
             C 85 15, 88 18, 86 22 
             C 90 24, 92 28, 89 32 
             C 93 36, 91 42, 86 46 
             C 84 50, 80 54, 83 60 
             C 79 66, 75 72, 78 78 
             C 73 84, 70 92, 74 100 
             Z" fill="#05070a" />

                <path
                    d="M 12 70 L 6 66 L 15 62 L 10 55 L 20 52 L 15 44 L 26 42 L 21 34 L 32 32 L 28 22 L 40 22 L 36 12 L 48 15 L 45 5 L 56 10 L 54 2 L 64 6 L 68 0 L 73 8 L 78 2 L 81 10"
                    fill="#05070a" />

                <path
                    d="M 81 14 L 92 8 L 95 18 L 88 20 C 85 18, 83 16, 81 14 Z M 83 24 L 94 28 L 91 35 C 87 33, 85 30, 83 24 Z"
                    fill="#05070a" />
            </svg>




            <div class="atomic-fire-beam"></div>

            <div class="header-content">
                <h1>foodZILLA</h1>
                <p>Choose the right category and explore delicious recipes</p>
            </div>

            <div class="skyline-buildings"></div>
        </header>

        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search for a recipe...">
        </div>

        <div class="categories" id="categories">
            <button class="category-btn active" data-category="all">all</button>
            <button class="category-btn" data-category="protein">Protein</button>
            <button class="category-btn" data-category="carbs">Carbohydrates</button>
            <button class="category-btn" data-category="sweets">Sweets</button>
            <button class="category-btn" data-category="fruits">Fruits</button>
            <button class="category-btn" data-category="dairy">Dairy</button>
        </div>



        <div class="recipes-grid" id="recipesGrid"></div>
    </div>

    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">×</button>
                <h2 id="modalTitle"></h2>
                <div id="modalIcon" style="font-size: 3em; margin-top: 10px;"></div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="account-overlay" id="accountOverlay" aria-hidden="true">
        <section class="account-panel" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
            <button class="account-close-btn" type="button" aria-label="Close" onclick="hideSignIn()">×</button>
            <p class="account-kicker">FOODZILLA ACCOUNT</p>
            <h2 id="accountTitle">Sign in</h2>
            <p class="account-intro">Add your details for delivery.</p>
            <form id="signInForm" class="account-form">
                <label>Name
                    <input name="name" type="text" autocomplete="name" required>
                </label>
                <label>Governorate
                    <input name="governorate" type="text" autocomplete="address-level1" required>
                </label>
                <label>City
                    <input name="city" type="text" autocomplete="address-level2" required>
                </label>
                <label>Address
                    <input name="address" type="text" autocomplete="street-address" required>
                </label>
                <label>Phone number
                    <input name="phone" type="tel" autocomplete="tel" required maxlength="11" pattern="[0-9]{10,15}" title="Please enter a valid phone number with 10 to 15 digits.">
                </label>
                <label>Password
                    <span class="password-control">
                        <input id="signInPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="16" required>
                        <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.8 15.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg>
                        </button>
                    </span>
                    <span class="field-hint">At least 8 characters and maximum 16 characters</span>
                </label>
                <p class="account-message" id="accountMessage" role="status"></p>
                <button class="account-submit-btn" type="submit">Save details</button>
            </form>
        </section>
    </div>

    <!-- ========================================================
         SESSION 9-10: CART DRAWER & CHECKOUT
         ======================================================== -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart(false)"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>🛒 My Cart</h3>
            <button class="cart-close-btn" onclick="toggleCart(false)">×</button>
        </div>

        <section class="cart-delivery" id="cartDelivery" aria-label="Delivery details"></section>

        <div class="cart-items" id="cartItemsList"></div>

        <div class="cart-footer">
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Subtotal:</span>
                    <span id="cartSubtotalPrice">0 EGP</span>
                </div>
                <div class="cart-summary-row">
                    <span>Delivery Fee:</span>
                    <span id="cartDeliveryFee">0 EGP</span>
                </div>
                <div class="cart-total-row">
                    <span>Total:</span>
                    <span id="cartTotalPrice">0 EGP</span>
                </div>
            </div>
            <div class="cart-footer-buttons">
                <button class="btn-checkout" onclick="checkoutCart()">Buy Now</button>
                <button class="btn-clear" onclick="clearCart()">Clear</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/project.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
